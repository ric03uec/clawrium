---
# Darwin counterpart to chat.yaml. It runs one finite Claude Code print-mode
# turn as the dedicated user, never a daemon or gateway. Prompt text reaches
# the command module through stdin; session IDs stay individual argv values.
- hosts: all
  gather_facts: false
  vars:
    claude_home: "/Users/{{ agent_name }}"
    claude_binary: "{{ claude_home }}/.local/claude/bin/claude"
    claude_chat_bootstrap: >-
      unset CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY;
      if [ -r "$HOME/.claude/clawrium-credentials.env" ]; then
      . "$HOME/.claude/clawrium-credentials.env";
      fi;
      exec "$@"
    # macOS does not include GNU timeout. Its bundled Perl and POSIX extension
    # provide the equivalent host-side bound: the child calls setsid(), then
    # the parent kills that whole process group and reports 124 on expiry.
    # This program is fixed, and all user data remains positional argv/stdin.
    claude_chat_timeout_wrapper: >-
      use POSIX qw(setsid); my $timeout = shift @ARGV; my $pid = fork();
      die "could not fork Claude Code" unless defined $pid;
      if ($pid == 0) { setsid() or die "could not create Claude Code session";
      exec @ARGV; die "could not exec Claude Code"; }
      $SIG{ALRM} = sub { kill 'KILL', -$pid; waitpid($pid, 0); exit 124; };
      alarm($timeout); waitpid($pid, 0); alarm(0); my $status = $?;
      exit($status & 127 ? 128 + ($status & 127) : $status >> 8);
  tasks:
    - name: Refuse to run Claude chat on non-Darwin host
      ansible.builtin.fail:
        msg: "Claude macOS chat playbook requires Darwin"
      when: ansible_os_family is defined and ansible_os_family != 'Darwin'

    - name: Validate agent_name for Claude chat
      ansible.builtin.fail:
        msg: "Invalid agent_name"
      when: agent_name is not match('^[a-z][a-z0-9_-]{0,31}$')

    - name: Validate Claude chat argv and prompt transport
      ansible.builtin.fail:
        msg: "Claude chat requires argv, prompt, and a positive timeout"
      when: >-
        (claude_chat_argv is not defined) or (claude_chat_argv | length == 0)
        or (claude_chat_prompt_b64 is not defined)
        or (claude_chat_prompt_b64 | length == 0)
        or (claude_chat_timeout is not defined) or (claude_chat_timeout | int < 1)

    - name: Run finite Claude Code chat command as dedicated agent user
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/perl', '-e', claude_chat_timeout_wrapper, claude_chat_timeout | string, '/bin/bash', '-c', claude_chat_bootstrap, 'clawrium-claude-chat', claude_binary] + claude_chat_argv }}"
        chdir: "{{ claude_home }}"
        stdin: "{{ claude_chat_prompt_b64 | b64decode }}"
        stdin_add_newline: false
      environment:
        HOME: "{{ claude_home }}"
        PATH: "{{ claude_home }}/.local/claude/bin:/opt/homebrew/bin:/usr/local/bin:/opt/local/bin:/usr/bin:/bin"
        DISABLE_AUTOUPDATER: "1"
      become: true
      become_user: "{{ agent_name }}"
      register: claude_chat_result
      failed_when: false
      changed_when: false
      no_log: true

    - name: Emit Claude chat stdout
      ansible.builtin.debug:
        msg: "CLAUDE_CHAT_STDOUT={{ claude_chat_result.stdout | default('') | b64encode }}"

    - name: Emit Claude chat stderr
      ansible.builtin.debug:
        msg: "CLAUDE_CHAT_STDERR={{ claude_chat_result.stderr | default('') | b64encode }}"

    - name: Emit Claude chat exit status
      ansible.builtin.debug:
        msg: "CLAUDE_CHAT_RC={{ claude_chat_result.rc | default(255) }}"
