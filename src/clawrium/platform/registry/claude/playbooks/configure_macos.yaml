---
# Darwin counterpart to configure.yaml. It writes only the dedicated
# user's native global Claude files and never invokes Claude Code or
# launchctl. The task-0 non-Darwin guard mirrors the sibling
# install_macos.yaml precedent — the resolver still owns dispatch,
# but a mis-routed Darwin runbook on a Linux host trips loudly.
- hosts: all
  become: yes
  tasks:
    - name: Refuse to run on non-Darwin hosts (dispatcher contract)
      ansible.builtin.fail:
        msg: configure_macos.yaml invoked against a non-Darwin host
      when: ansible_os_family != "Darwin"

    - name: Validate agent_name (defense-in-depth)
      ansible.builtin.fail:
        msg: "Invalid agent_name"
      when: agent_name is not match('^[a-z][a-z0-9_-]{0,31}$')

    - name: Validate rendered Claude OAuth credential body
      ansible.builtin.assert:
        that:
          - claude_oauth_credentials is string
          - claude_oauth_credentials | length > 0
      no_log: true

    - name: Create dedicated Claude global settings directory
      ansible.builtin.file:
        path: "/Users/{{ agent_name }}/.claude"
        state: directory
        owner: "{{ agent_name }}"
        group: staff
        mode: "0700"

    - name: Write bounded global Claude settings
      ansible.builtin.copy:
        content: "{{ prerendered_claude_settings_json }}"
        dest: "/Users/{{ agent_name }}/.claude/settings.json"
        owner: "{{ agent_name }}"
        group: staff
        mode: "0600"

    - name: Write Claude first-run onboarding marker
      ansible.builtin.copy:
        content: "{{ prerendered_claude_onboarding_json }}"
        dest: "/Users/{{ agent_name }}/.claude.json"
        owner: "{{ agent_name }}"
        group: staff
        mode: "0600"

    - name: Atomically replace native Claude OAuth credentials
      ansible.builtin.copy:
        content: "{{ claude_oauth_credentials }}"
        dest: "/Users/{{ agent_name }}/.claude/.credentials.json"
        owner: "{{ agent_name }}"
        group: staff
        mode: "0600"
        unsafe_writes: false
      no_log: true
      diff: false

    # Retired env/profile hook cleanup. Removal runs ONLY after the native
    # credentials file is in place so the host is never left without an
    # active credential.
    - name: Remove retired Claude credential env file
      ansible.builtin.file:
        path: "/Users/{{ agent_name }}/.claude/clawrium-credentials.env"
        state: absent

    - name: Remove retired Claude profile hook
      ansible.builtin.file:
        path: "/Users/{{ agent_name }}/.profile.d/clawrium-claude.sh"
        state: absent
