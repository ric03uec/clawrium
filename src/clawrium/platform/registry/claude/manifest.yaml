agent:
  type: claude
  description: "Anthropic Claude Code (on-demand CLI chat; no daemon or web UI)"

# Claude Code is a user-scoped npm package. Chat launches a finite print-mode
# CLI process on demand as the dedicated agent user; it never starts a daemon,
# gateway, listener, or native web UI. Bounded settings and private credentials
# use the no-daemon configure/sync paths rather than manifest feature flags.
features:
  chat:
    type: claude

platforms:
  - version: "2.1.100"
    os: ubuntu
    os_version: "24.04"
    arch: x86_64
    requirements:
      min_memory_mb: 1024
      gpu_required: false
      dependencies:
        nodejs: ">=20.0.0"
  - version: "2.1.100"
    os: ubuntu
    os_version: "22.04"
    arch: x86_64
    requirements:
      min_memory_mb: 1024
      gpu_required: false
      dependencies:
        nodejs: ">=20.0.0"
  - version: "2.1.100"
    os: macos
    os_version: ">=14"
    arch: arm64
    requirements:
      min_memory_mb: 1024
      gpu_required: false
      dependencies:
        nodejs: ">=20.0.0"
