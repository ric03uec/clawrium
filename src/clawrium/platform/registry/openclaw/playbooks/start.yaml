---
# Phase 3 of #11 (#945): openclaw lifecycle is delegated to the
# NemoClaw sandbox. This playbook intentionally does not create,
# rewrite, start, or verify a host-side openclaw systemd service.
- hosts: all
  become: yes
  vars:
    nemoclaw_binary: "/usr/local/bin/nemoclaw"
  tasks:
    - name: Refuse to run on non-Linux hosts (dispatcher contract)
      ansible.builtin.fail:
        msg: start.yaml invoked against non-Linux host for NemoClaw-backed openclaw
      when: ansible_os_family == "Darwin"

    - name: Assert sandbox_name extravar is provided
      ansible.builtin.assert:
        that:
          - sandbox_name is defined
          - sandbox_name | length > 0
        fail_msg: >-
          `sandbox_name` extravar is required for NemoClaw-backed
          openclaw start. This is a legacy bare record; remove +
          re-create the agent per docs/releases/26.7.3/CHANGELOG.md.

    - name: Assert nemoclaw binary is present on host
      ansible.builtin.stat:
        path: "{{ nemoclaw_binary }}"
      register: nemoclaw_stat

    - name: Fail if nemoclaw binary is missing
      ansible.builtin.fail:
        msg: >-
          nemoclaw binary not found at {{ nemoclaw_binary }}. Re-run
          `clawctl host prepare <host>` before starting openclaw.
      when: not nemoclaw_stat.stat.exists

    - name: Start NemoClaw sandbox {{ sandbox_name }}
      ansible.builtin.command:
        argv:
          - "{{ nemoclaw_binary }}"
          - start
          - "{{ sandbox_name }}"
      register: nemoclaw_start_result
      changed_when: nemoclaw_start_result.rc == 0

    - name: Verify NemoClaw sandbox {{ sandbox_name }} status
      ansible.builtin.command:
        argv:
          - "{{ nemoclaw_binary }}"
          - status
          - "{{ sandbox_name }}"
      register: nemoclaw_status_result
      changed_when: false
      failed_when: nemoclaw_status_result.rc != 0

    - name: Display success message
      ansible.builtin.debug:
        msg: "OpenClaw NemoClaw sandbox {{ sandbox_name }} started successfully"
