---
- hosts: all
  become: yes
  become_method: sudo
  vars:
    nemoclaw_binary: "/usr/local/bin/nemoclaw"
  tasks:
    # Phase 3 of #11 (issue #945): tear down the NemoClaw sandbox
    # BEFORE uninstalling the host-side openclaw bits. `sandbox_name`
    # is threaded in by `_run_lifecycle_playbook` for every openclaw
    # op (see `core/lifecycle.py`). A missing sandbox_name — legacy
    # bare record that predates Phase 3 — is a fail-fast condition:
    # the operator needs to know their record is stale so they can
    # remove it manually with `nemoclaw destroy` if necessary. Missing
    # nemoclaw binary (never installed) is a fast-skip, not a failure,
    # so `remove` still succeeds against a half-installed host.
    - name: Assert sandbox_name is present for sandbox teardown
      ansible.builtin.assert:
        that:
          - sandbox_name is defined
          - sandbox_name | length > 0
        fail_msg: >-
          openclaw remove: no sandbox_name in hosts.json config.
          This is a legacy bare openclaw record predating Phase 3
          of #11 (issue #945). Remove it manually with
          `nemoclaw destroy <sandbox>` on the host, then re-run
          `clawctl agent remove` to clean local state.

    - name: Check nemoclaw binary is present
      ansible.builtin.stat:
        path: "{{ nemoclaw_binary }}"
      register: nemoclaw_stat

    - name: Destroy NemoClaw sandbox {{ sandbox_name }}
      ansible.builtin.command:
        argv:
          - "{{ nemoclaw_binary }}"
          - destroy
          - "{{ sandbox_name }}"
      register: nemoclaw_destroy_result
      changed_when: nemoclaw_destroy_result.rc == 0
      failed_when:
        - nemoclaw_destroy_result.rc != 0
        # A "sandbox not found" exit MUST NOT fail the remove — the
        # sandbox may have already been torn down out-of-band. Match
        # by exit code and stderr shape once upstream stabilizes; for
        # now we only treat rc != 0 as failure when stderr also lacks
        # a "not found" hint.
        - "'not found' not in (nemoclaw_destroy_result.stderr | default(''))"
      when: nemoclaw_stat.stat.exists

    - name: Check if systemd service exists
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ agent_type }}-{{ agent_name }}.service"
      register: service_file

    - name: Stop openclaw service if running
      ansible.builtin.systemd:
        name: "{{ agent_type }}-{{ agent_name }}"
        state: stopped
      when: service_file.stat.exists
      ignore_errors: yes

    - name: Disable openclaw service
      ansible.builtin.systemd:
        name: "{{ agent_type }}-{{ agent_name }}"
        enabled: no
      when: service_file.stat.exists
      ignore_errors: yes

    - name: Remove systemd service file
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ agent_type }}-{{ agent_name }}.service"
        state: absent
      notify: Reload systemd

    - name: Check if openclaw installation exists
      ansible.builtin.stat:
        path: "/home/{{ agent_name }}/openclaw"
      register: install_dir

    - name: Remove openclaw installation directory
      ansible.builtin.file:
        path: "/home/{{ agent_name }}/openclaw"
        state: absent
      when: install_dir.stat.exists

    - name: Check if openclaw runtime prefix exists
      ansible.builtin.stat:
        path: "/home/{{ agent_name }}/.openclaw"
      register: runtime_prefix_dir

    - name: Remove openclaw runtime prefix
      ansible.builtin.file:
        path: "/home/{{ agent_name }}/.openclaw"
        state: absent
      when: runtime_prefix_dir.stat.exists

    - name: Check if workspace directory exists
      ansible.builtin.stat:
        path: "/home/{{ agent_name }}/workspace"
      register: workspace_dir

    - name: Remove workspace directory
      ansible.builtin.file:
        path: "/home/{{ agent_name }}/workspace"
        state: absent
      when: workspace_dir.stat.exists

    - name: Check if agent user exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ agent_name }}"
      register: user_check
      ignore_errors: yes

    - name: Remove agent user account
      ansible.builtin.user:
        name: "{{ agent_name }}"
        state: absent
        remove: yes
      when: user_check is not failed

    - name: Display success message
      ansible.builtin.debug:
        msg: "OpenClaw removed successfully"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes
