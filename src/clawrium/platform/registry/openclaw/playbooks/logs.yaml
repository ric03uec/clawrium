---
# Phase 3 of #11 (#945): read-only log retrieval from the NemoClaw
# sandbox backing an openclaw agent.
- hosts: all
  become: yes
  vars:
    nemoclaw_binary: "/usr/local/bin/nemoclaw"
  tasks:
    - name: Refuse to run on non-Linux hosts (dispatcher contract)
      ansible.builtin.fail:
        msg: logs.yaml invoked against non-Linux host for NemoClaw-backed openclaw
      when: ansible_os_family == "Darwin"

    - name: Assert sandbox_name extravar is provided
      ansible.builtin.assert:
        that:
          - sandbox_name is defined
          - sandbox_name | length > 0
        fail_msg: >-
          `sandbox_name` extravar is required for NemoClaw-backed
          openclaw logs. This is a legacy bare record; remove +
          re-create the agent per docs/releases/26.7.3/CHANGELOG.md.

    - name: Assert nemoclaw binary is present on host
      ansible.builtin.stat:
        path: "{{ nemoclaw_binary }}"
      register: nemoclaw_stat

    - name: Fail if nemoclaw binary is missing
      ansible.builtin.fail:
        msg: >-
          nemoclaw binary not found at {{ nemoclaw_binary }}. Re-run
          `clawctl host prepare <host>` before reading openclaw logs.
      when: not nemoclaw_stat.stat.exists

    - name: Read NemoClaw sandbox {{ sandbox_name }} logs
      ansible.builtin.command:
        argv:
          - "{{ nemoclaw_binary }}"
          - logs
          - "{{ sandbox_name }}"
      register: nemoclaw_logs_result
      changed_when: false
      failed_when: nemoclaw_logs_result.rc != 0

    - name: Display NemoClaw sandbox logs
      ansible.builtin.debug:
        msg: "{{ nemoclaw_logs_result.stdout }}"
