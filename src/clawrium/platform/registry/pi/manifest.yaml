agent:
  type: pi
  description: "Pi coding agent (on-demand CLI; no daemon or native web UI)"

# Pi is invoked only through finite `agent exec` / chat calls. It has no
# service, listener, gateway, or native dashboard.
features:
  chat:
    type: pi

platforms:
  - version: "0.73.1"
    os: ubuntu
    os_version: "24.04"
    arch: x86_64
    requirements:
      min_memory_mb: 1024
      gpu_required: false
      dependencies:
        nodejs: ">=20.6.0"
  - version: "0.73.1"
    os: macos
    os_version: ">=14"
    arch: arm64
    requirements:
      min_memory_mb: 1024
      gpu_required: false
      dependencies:
        nodejs: ">=20.6.0"
