---
# Darwin Pi execution is fail-closed on the root-owned identity transaction.
- hosts: all
  gather_facts: false
  become: yes
  vars:
    pi_home: "/Users/{{ agent_name }}"
    pi_binary: "{{ pi_home }}/.local/pi/bin/pi"
    pi_marker: "/Library/Application Support/clawrium/pi/{{ agent_name }}.json"
    # Native output is encrypted to this per-run controller certificate before
    # it enters any Ansible event. The matching private key never leaves the
    # controller's mode-0700 runner directory.
    pi_exec_timeout_wrapper: >-
      use POSIX qw(setsid); my $timeout = shift @ARGV; my $pid = fork(); die "could not fork Pi" unless defined $pid; if ($pid == 0) { setsid() or die "could not create Pi session"; exec @ARGV; die "could not exec Pi"; } $SIG{ALRM} = sub { kill 'KILL', -$pid; waitpid($pid, 0); exit 124; }; alarm($timeout); waitpid($pid, 0); alarm(0); my $status = $?; exit($status & 127 ? 128 + ($status & 127) : $status >> 8);
    # Both inference and diagnostic execution use a credential-free environment;
    # diagnostics intentionally cannot inspect inherited AWS endpoint overrides.
    pi_exec_capture_bootstrap: >-
      PATH=/usr/bin:/bin; export PATH; unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN AWS_BEARER_TOKEN_BEDROCK AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_CREDENTIALS_FULL_URI AWS_CONTAINER_AUTHORIZATION_TOKEN AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE AWS_WEB_IDENTITY_TOKEN_FILE AWS_ROLE_ARN AWS_ROLE_SESSION_NAME AWS_ROLE_SESSION_DURATION AWS_SHARED_CREDENTIALS_FILE AWS_PROFILE AWS_DEFAULT_PROFILE AWS_REGION AWS_DEFAULT_REGION AWS_CONFIG_FILE AWS_SDK_LOAD_CONFIG AWS_CA_BUNDLE AWS_STS_REGIONAL_ENDPOINTS AWS_EC2_METADATA_SERVICE_ENDPOINT AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE AWS_USE_FIPS_ENDPOINT AWS_USE_DUALSTACK_ENDPOINT OPENROUTER_API_KEY AWS_ENDPOINT_URL; for aws_endpoint_var in $(/usr/bin/env | /usr/bin/grep '^AWS_ENDPOINT_URL_' | /usr/bin/cut -d= -f1); do unset "$aws_endpoint_var"; done; AWS_EC2_METADATA_DISABLED=true; export AWS_EC2_METADATA_DISABLED; umask 077; tmpdir="$(/usr/bin/mktemp -d "${TMPDIR:-/tmp}/clawrium-pi-exec.XXXXXX")" || exit 125; trap '/bin/rm -rf "$tmpdir"' EXIT HUP INT TERM; program=$1; recipient_certificate=$2; mode=$3; shift 3; unset OPENROUTER_API_KEY AWS_PROFILE AWS_REGION AWS_CONFIG_FILE; printf '%s\n' "$recipient_certificate" > "$tmpdir/recipient.pem" || exit 125; case "$mode" in inference) env_file="$HOME/.pi/agent/clawrium-provider.env"; test -f "$env_file" && test ! -L "$env_file" || exit 126; seen_openrouter=0; seen_aws_profile=0; seen_aws_region=0; seen_aws_config=0; while IFS= read -r line; do case "$line" in OPENROUTER_API_KEY=*) test "$seen_openrouter" = 0 || exit 126; seen_openrouter=1; OPENROUTER_API_KEY=${line#OPENROUTER_API_KEY=} ;; AWS_PROFILE=*) test "$seen_aws_profile" = 0 || exit 126; seen_aws_profile=1; AWS_PROFILE=${line#AWS_PROFILE=} ;; AWS_REGION=*) test "$seen_aws_region" = 0 || exit 126; seen_aws_region=1; AWS_REGION=${line#AWS_REGION=} ;; AWS_CONFIG_FILE='$HOME/.pi/agent/clawrium-aws-config') test "$seen_aws_config" = 0 || exit 126; seen_aws_config=1; AWS_CONFIG_FILE="$HOME/.pi/agent/clawrium-aws-config" ;; *) exit 126 ;; esac; done < "$env_file"; if test "$seen_openrouter" = 1; then test "$seen_aws_profile$seen_aws_region$seen_aws_config" = 000 || exit 126; test -n "${OPENROUTER_API_KEY:-}" || exit 126; export OPENROUTER_API_KEY; elif test "$seen_aws_profile$seen_aws_region$seen_aws_config" = 111; then test ! -L "$AWS_CONFIG_FILE" || exit 126; AWS_SHARED_CREDENTIALS_FILE="$HOME/.pi/agent/clawrium-aws-credentials"; test -f "$AWS_SHARED_CREDENTIALS_FILE" && test ! -L "$AWS_SHARED_CREDENTIALS_FILE" && test -O "$AWS_SHARED_CREDENTIALS_FILE" && test ! -s "$AWS_SHARED_CREDENTIALS_FILE" && test "$(/usr/bin/stat -f %Lp "$AWS_SHARED_CREDENTIALS_FILE")" = 600 || exit 126; export AWS_PROFILE AWS_REGION AWS_CONFIG_FILE AWS_SHARED_CREDENTIALS_FILE; else exit 126; fi ;; diagnostic) ;; *) exit 125 ;; esac; "$@" >"$tmpdir/stdout" 2>"$tmpdir/stderr"; rc=$?; set -o pipefail; /usr/bin/perl -e "$program" "$tmpdir/stdout" "$tmpdir/stderr" "$rc" | /usr/bin/openssl cms -encrypt -binary -outform DER -aes-256-cbc -recip "$tmpdir/recipient.pem" | /usr/bin/base64 | /usr/bin/tr -d '\n'
    pi_exec_capture_program: >-
      use strict; use warnings; use Encode qw(decode FB_DEFAULT); use JSON::PP qw(encode_json); sub read_text { my ($path) = @_; return '' unless -r $path; open my $fh, '<:raw', $path or return ''; local $/; my $raw = <$fh>; return decode('UTF-8', $raw // '', FB_DEFAULT); } my ($stdout_path, $stderr_path, $rc_raw) = @ARGV; my $rc = $rc_raw =~ /\A\d+\z/ ? int($rc_raw) : 255; print encode_json({ stdout => read_text($stdout_path), stderr => read_text($stderr_path), rc => $rc });
  tasks:
    - name: Refuse non-Darwin dispatcher target
      ansible.builtin.fail: { msg: "exec_macos.yaml requires Darwin" }
      when: ansible_os_family is defined and ansible_os_family != "Darwin"
    - name: Validate Pi agent name
      ansible.builtin.fail: { msg: "Invalid agent_name" }
      when: agent_name is not match('^[a-z][a-z0-9_-]{0,31}$')
    - name: Validate Pi exec argv and timeout
      ansible.builtin.fail:
        msg: "Pi exec requires a non-empty string argv and a timeout from 1 to 120 seconds"
      when: >-
        (cmd_argv is not defined) or (cmd_argv is string) or (cmd_argv | length == 0)
        or (cmd_argv | reject('string') | list | length > 0)
        or (cmd_argv | select('equalto', '') | list | length > 0)
        or (pi_exec_timeout is not defined) or (pi_exec_timeout | int < 1)
        or (pi_exec_timeout | int > 120)
    - name: Read dedicated Pi account UID
      ansible.builtin.shell: "PATH=/usr/bin:/bin; export PATH; /usr/bin/dscl . -read /Users/{{ agent_name | quote }} UniqueID 2>/dev/null | /usr/bin/awk '/UniqueID:/{print $2}'"
      args: { executable: /bin/bash }
      register: pi_account_uid
      changed_when: false
      failed_when: false
    - name: Read dedicated Pi account comment
      ansible.builtin.shell: "PATH=/usr/bin:/bin; export PATH; /usr/bin/dscl . -read /Users/{{ agent_name | quote }} Comment 2>/dev/null | /usr/bin/sed -n 's/^Comment: //p'"
      args: { executable: /bin/bash }
      register: pi_account_comment
      changed_when: false
      failed_when: false
    - name: Read dedicated Pi account home
      ansible.builtin.shell: "PATH=/usr/bin:/bin; export PATH; /usr/bin/dscl . -read /Users/{{ agent_name | quote }} NFSHomeDirectory 2>/dev/null | /usr/bin/sed -n 's/^NFSHomeDirectory: //p'"
      args: { executable: /bin/bash }
      register: pi_account_home
      changed_when: false
      failed_when: false
    - name: Check Pi ownership marker
      ansible.builtin.stat: { path: "{{ pi_marker }}" }
      register: pi_marker_stat
    - name: Reject untrusted Pi execution target
      ansible.builtin.assert:
        that: ["(pi_account_uid.stdout | trim) != ''", "pi_marker_stat.stat.exists | bool", "not (pi_marker_stat.stat.islnk | default(false) | bool)", "pi_marker_stat.stat.pw_name == 'root'", "pi_marker_stat.stat.gr_name == 'wheel'", "pi_marker_stat.stat.mode == '0600'"]
        fail_msg: "Refusing Pi execution: ownership marker does not prove the dedicated account."
    - name: Read Pi ownership marker
      ansible.builtin.slurp: { src: "{{ pi_marker }}" }
      register: pi_marker_content
    - name: Parse Pi ownership marker
      ansible.builtin.set_fact: { pi_marker_data: "{{ pi_marker_content.content | b64decode | from_json }}" }
    - name: Verify Pi execution ownership binding
      ansible.builtin.assert:
        that:
          - pi_marker_data.schema == 2
          - pi_marker_data.agent_name == agent_name
          - pi_marker_data.home == pi_home
          - pi_marker_data.uid == (pi_account_uid.stdout | trim | int)
          - (pi_account_home.stdout | trim) == pi_home
          - pi_marker_data.transaction_id is match('^[0-9a-f-]{36}$')
          - (pi_account_comment.stdout | trim) == ('clawrium-pi-' ~ pi_marker_data.transaction_id)
        fail_msg: "Refusing Pi execution: ownership marker does not bind the dedicated account."
    - name: Validate Pi native exec mode
      ansible.builtin.fail: { msg: "Pi exec requires a controller-selected mode" }
      when: pi_exec_mode is not defined or pi_exec_mode not in ['diagnostic', 'inference']
    - name: Run encrypted Pi native command
      ansible.builtin.command:
        expand_argument_vars: false
        argv: "{{ ['/bin/bash', '-c', pi_exec_capture_bootstrap, 'clawrium-pi-exec', pi_exec_capture_program, pi_exec_recipient_certificate, pi_exec_mode, '/usr/bin/perl', '-e', pi_exec_timeout_wrapper, pi_exec_timeout | string, pi_binary] + cmd_argv }}"
        chdir: "{{ pi_home }}"
        stdin: "{{ pi_exec_prompt_b64 | default('') | b64decode }}"
        stdin_add_newline: false
      environment: { HOME: "{{ pi_home }}", PATH: "{{ pi_home }}/.local/pi/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin", PI_DISABLE_AUTOUPDATE: "1" }
      become: true
      become_user: "{{ agent_name }}"
      register: pi_exec_safe_result
      failed_when: false
      changed_when: false
      no_log: true
    - name: Emit encrypted Pi exec result
      ansible.builtin.debug: { msg: "PI_EXEC_RESULT={{ pi_exec_safe_result.stdout | default('') }}" }
