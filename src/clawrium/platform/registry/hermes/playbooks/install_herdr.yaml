---
# Sync-time, idempotent migration for legacy Hermes instances.
- import_playbook: ../../../playbooks/herdr.yaml
- hosts: all
  become: yes
  tasks:
    - name: Inspect Herdr Hermes plugin directory
      ansible.builtin.stat:
        path: "/home/{{ agent_name }}/.hermes/plugins/herdr-agent-state"
      register: herdr_plugin
    - name: Install official Herdr Hermes integration when missing
      ansible.builtin.command:
        argv: [/usr/local/bin/herdr, integration, install, hermes]
      become_user: "{{ agent_name }}"
      environment:
        HOME: "/home/{{ agent_name }}"
        HERMES_HOME: "/home/{{ agent_name }}/.hermes"
        PATH: "/usr/local/bin:/usr/bin:/bin"
      when: not herdr_plugin.stat.exists
